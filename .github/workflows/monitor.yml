name: Monitor Compra Agil

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      operacion:
        description: "Inicializar historico SIN correos o ejecutar monitor"
        required: true
        type: choice
        default: "inicializar_historico"
        options:
          - inicializar_historico
          - revisar

permissions:
  contents: write

concurrency:
  group: monitor-compra-agil
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Inicializar historial sin enviar correos
        if: github.event_name == 'workflow_dispatch' && inputs.operacion == 'inicializar_historico'
        run: python monitor.py --baseline

      - name: Ejecutar monitor
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operacion == 'revisar')
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_DESTINATARIOS: ${{ secrets.GMAIL_DESTINATARIOS }}
          EMAIL_ACTIVADO: ${{ vars.EMAIL_ACTIVADO }}
          DRY_RUN: ${{ vars.EMAIL_ACTIVADO == 'true' && 'false' || 'true' }}
        run: python monitor.py

      - name: Guardar resultados SQLite
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oportunidades.db
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de Compra Agil [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Sin cambios en la base de datos"
          fi
